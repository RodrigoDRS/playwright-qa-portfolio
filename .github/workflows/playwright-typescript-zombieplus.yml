name: Playwright TypeScript Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'playwright-typescript-zombieplus/**'
      - '.github/workflows/playwright-typescript.yml'

  pull_request:
    branches: [main, master]
    paths:
      - 'playwright-typescript-zombieplus/**'
      - '.github/workflows/playwright-typescript.yml'

  workflow_dispatch:

jobs:
  test:
    name: Run TypeScript tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwright-typescript-zombieplus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright-typescript-zombieplus/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: 

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-typescript-report
          path: playwright-typescript-zombieplus/playwright-report/
          retention-days: 30
          if-no-files-found: error