name: Playwright JavaScript Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'playwright-javascript-expandtesting/**'
      - '.github/workflows/playwright-javascript.yml'

  pull_request:
    branches: [main, master]
    paths:
      - 'playwright-javascript-expandtesting/**'
      - '.github/workflows/playwright-javascript.yml'

  workflow_dispatch:

jobs:
  test:
    name: Run JavaScript tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwright-javascript-expandtesting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright-javascript-expandtesting/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-javascript-report
          path: playwright-javascript-expandtesting/playwright-report/
          retention-days: 30
          if-no-files-found: error